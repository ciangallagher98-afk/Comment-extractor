<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Analytics Pro | 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 text-slate-900 font-sans">
    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 tracking-tight text-center md:text-left">Social Analytics Pro</h1>
                <p id="file-status" class="text-slate-500 text-sm text-center md:text-left">Upload screenshots for deep analysis</p>
            </div>
            <div class="flex items-center gap-3">
                <input type="file" id="upload" accept="image/*" multiple class="hidden" onchange="handleFileSelect()">
                <button onclick="document.getElementById('upload').click()" class="bg-slate-100 text-slate-700 px-5 py-2.5 rounded-xl font-semibold hover:bg-slate-200 transition-all">Choose Images</button>
                <button onclick="startAnalysis()" id="btn-run" class="hidden bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all">Analyze Now</button>
            </div>
        </div>

        <div id="top-row" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 hidden">
            <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="text-[10px] uppercase tracking-widest text-slate-400 font-black mb-4 italic">Conversation Summary</h3>
                <p id="summary-text" class="text-slate-700 leading-relaxed text-sm">Analyzing themes...</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center">
                <h3 class="text-[10px] uppercase tracking-widest text-slate-400 font-black mb-4 italic text-center">Sentiment Share of Voice (SOV)</h3>
                <div class="w-full max-w-[150px] relative">
                    <canvas id="sovChart"></canvas>
                </div>
                <div id="stat-sov" class="mt-4 flex gap-4 text-[10px] font-bold"></div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
                <h3 class="font-bold text-slate-800">Extracted Comments</h3>
                <div id="export-actions" class="hidden flex items-center gap-3">
                    <button onclick="downloadCSV(false)" class="text-indigo-600 text-[10px] font-black hover:bg-indigo-50 px-3 py-2 rounded-lg border border-indigo-100 transition-all">📥 BASIC CSV</button>
                    <button onclick="downloadCSV(true)" class="bg-indigo-600 text-white text-[10px] font-black px-4 py-2 rounded-lg hover:bg-indigo-700 shadow-sm transition-all tracking-widest">📊 SENTIMENT REPORT</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50/50">
                        <tr>
                            <th class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">PublishedAt</th>
                            <th class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Screen Name</th>
                            <th class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest w-1/3">Content</th>
                            <th class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Likes</th>
                            <th class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right">Sentiment</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-12 text-center text-slate-300 italic text-sm">Upload images to begin processing.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentData = [];
        let summaryData = "";
        let sovData = {};
        let analysisTime = null;
        let myChart = null;

        function handleFileSelect() {
            const files = document.getElementById('upload').files;
            const btn = document.getElementById('btn-run');
            const status = document.getElementById('file-status');
            if (files.length > 0) {
                btn.classList.remove('hidden');
                status.innerText = `${files.length} file(s) ready.`;
            }
        }

        function convertToISO(relative) {
            const now = analysisTime || new Date();
            const date = new Date(now);
            const r = (relative || "0s").toLowerCase();
            const val = parseInt(r.match(/\d+/) || 0);
            if (r.includes('s')) date.setSeconds(now.getSeconds() - val);
            else if (r.includes('m') && !r.includes('mo')) date.setMinutes(now.getMinutes() - val);
            else if (r.includes('h')) date.setHours(now.getHours() - val);
            else if (r.includes('d')) date.setDate(now.getDate() - val);
            else if (r.includes('w')) date.setDate(now.getDate() - (val * 7));
            else if (r.includes('mo')) date.setMonth(now.getMonth() - val);
            else if (r.includes('y')) date.setFullYear(now.getFullYear() - val);
            return date.toISOString();
        }

        async function startAnalysis() {
            const files = document.getElementById('upload').files;
            const btn = document.getElementById('btn-run');
            const tbody = document.getElementById('table-body');
            
            analysisTime = new Date();
            btn.disabled = true;
            btn.innerText = "OCR STARTING...";
            tbody.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-indigo-500 font-bold animate-pulse">READING PIXELS...</td></tr>`;

            try {
                let textBlob = "";
                for (let i = 0; i < files.length; i++) {
                    btn.innerText = `OCR: ${i+1}/${files.length}`;
                    const { data: { text } } = await Tesseract.recognize(files[i], 'eng');
                    textBlob += `\n[IMAGE_${i+1}]\n${text}`;
                }

                btn.innerText = "AI THINKING...";
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ payload: textBlob })
                });

                const result = await response.json();
                if (result.error) throw new Error(result.error);

                currentData = result.comments;
                summaryData = result.summary;
                sovData = result.sov;
                renderDashboard();

            } catch (err) {
                alert("Error: " + err.message);
                tbody.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-red-500">Failed: ${err.message}</td></tr>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Analyze Now";
            }
        }

        function renderDashboard() {
            document.getElementById('top-row').classList.remove('hidden');
            document.getElementById('export-actions').classList.remove('hidden');
            document.getElementById('summary-text').innerText = summaryData;

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = currentData.map(c => {
                const isImg = c.text && c.text.includes("[Image/GIF Only]");
                return `
                    <tr class="hover:bg-slate-50 transition-colors ${isImg ? 'opacity-40' : ''}">
                        <td class="p-4 font-mono text-[9px] text-slate-400">${convertToISO(c.timestamp)}</td>
                        <td class="p-4 font-bold text-slate-700 text-xs uppercase">${c.author}</td>
                        <td class="p-4 text-xs ${isImg ? 'italic' : 'text-slate-600'}">${c.text}</td>
                        <td class="p-4 font-black text-slate-800 text-xs text-center">${c.likes}</td>
                        <td class="p-4 text-right">
                            <span class="px-2 py-1 rounded text-[9px] font-black uppercase ${getStyle(c.sentiment)}">
                                ${c.sentiment || 'Neutral'}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');

            // Safe Sentiment Parsing
            const pos = sovData.Positive || sovData.positive || 0;
            const neg = sovData.Negative || sovData.negative || 0;
            const neu = sovData.Neutral || sovData.neutral || 0;

            document.getElementById('stat-sov').innerHTML = `
                <span class="text-emerald-500">POS ${pos}%</span>
                <span class="text-rose-500">NEG ${neg}%</span>
                <span class="text-slate-400">NEU ${neu}%</span>
            `;

            updateChart(pos, neg, neu);
        }

        function updateChart(pos, neg, neu) {
            const ctx = document.getElementById('sovChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Pos', 'Neg', 'Neu'],
                    datasets: [{
                        data: [pos, neg, neu],
                        backgroundColor: ['#10b981', '#f43f5e', '#94a3b8'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: { plugins: { legend: { display: false } }, cutout: '75%' }
            });
        }

        function getStyle(s) {
            if (s === 'Positive') return 'bg-emerald-50 text-emerald-600';
            if (s === 'Negative') return 'bg-rose-50 text-rose-600';
            return 'bg-slate-50 text-slate-400 border border-slate-100';
        }

        function downloadCSV(withSent) {
            const cleanData = currentData.filter(c => !c.text.includes("[Image/GIF Only]"));
            let head = "UUID,PublishedAt,Screen Name,Content,Likes";
            if (withSent) head += ",Sentiment";
            
            let rows = [head];
            cleanData.forEach(c => {
                let row = [
                    crypto.randomUUID(),
                    convertToISO(c.timestamp),
                    `"${c.author.replace(/"/g, '""')}"`,
                    `"${c.text.replace(/"/g, '""')}"`,
                    c.likes
                ];
                if (withSent) row.push(c.sentiment);
                rows.push(row.join(","));
            });

            const blob = new Blob([rows.join("\n")], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `report_${withSent ? 'full' : 'basic'}.csv`;
            a.click();
        }
    </script>
</body>
</html>
