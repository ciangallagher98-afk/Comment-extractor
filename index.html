<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Comment Scraper (2026 Stable)</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold mb-4">AI Comment Scraper</h1>
        
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Upload Screenshot</label>
            <input type="file" id="upload" accept="image/*" class="w-full border p-2 rounded">
        </div>

        <div class="flex gap-4 mb-6">
            <button onclick="processImage()" id="btn-extract" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Extract Comments</button>
        </div>

        <div id="status" class="text-sm text-blue-600 mb-4 hidden">Processing image... (OCR)</div>
        <div id="results" class="space-y-4"></div>
    </div>

    <script>
        async function processImage() {
            const file = document.getElementById('upload').files[0];
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            const btn = document.getElementById('btn-extract');

            if (!file) return alert("Please upload an image");

            status.classList.remove('hidden');
            btn.disabled = true;
            results.innerHTML = "";

            try {
                // 1. Browser-side OCR
                status.innerText = "Step 1/2: Reading text from image...";
                const { data: { text } } = await Tesseract.recognize(file, 'eng');

                // 2. Send text to Groq via Vercel
                status.innerText = "Step 2/2: Organizing with AI...";
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: 'extraction', payload: text })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error);

                // 3. Display Results
                data.comments.forEach(c => {
                    const div = document.createElement('div');
                    div.className = "p-4 border rounded bg-gray-50";
                    div.innerHTML = `<strong>${c.author}</strong> <span class="text-gray-500 text-sm">${c.timestamp}</span><p>${c.text}</p>`;
                    results.appendChild(div);
                });

            } catch (err) {
                results.innerHTML = `<div class="text-red-500 font-mono text-xs p-4 bg-red-50 rounded">${err.message}</div>`;
            } finally {
                status.classList.add('hidden');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
