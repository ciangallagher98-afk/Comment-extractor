<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Analytics Pro | 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 text-slate-900 font-sans">
    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Social Analytics Pro</h1>
                <p id="file-status" class="text-slate-500 text-sm">Upload screenshots to begin analysis</p>
            </div>
            <div class="flex items-center gap-3">
                <input type="file" id="upload" accept="image/*" multiple class="hidden" onchange="handleFileSelect()">
                <button onclick="document.getElementById('upload').click()" class="bg-slate-100 text-slate-700 px-5 py-2.5 rounded-xl font-semibold hover:bg-slate-200 transition-all">
                    Choose Images
                </button>
                <button onclick="startAnalysis()" id="btn-run" class="hidden bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all">
                    Analyze Now
                </button>
            </div>
        </div>

        <div id="top-row" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 hidden">
            <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="text-xs uppercase tracking-widest text-slate-400 font-black mb-4">AI Summary</h3>
                <p id="summary-text" class="text-slate-700 leading-relaxed italic">Generating summary...</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center">
                <h3 class="text-xs uppercase tracking-widest text-slate-400 font-black mb-4">Sentiment SOV</h3>
                <div class="w-full max-w-[180px]">
                    <canvas id="sovChart"></canvas>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
                <h3 class="font-bold text-slate-800">Extracted Insights</h3>
                <div id="export-actions" class="hidden flex items-center gap-3">
                    <button onclick="downloadCSV(false)" class="text-indigo-600 text-xs font-bold hover:bg-indigo-50 px-3 py-2 rounded-lg transition-colors border border-indigo-100">📥 DATA ONLY</button>
                    <button onclick="downloadCSV(true)" class="bg-indigo-600 text-white text-xs font-bold px-3 py-2 rounded-lg hover:bg-indigo-700 transition-colors shadow-sm">📊 WITH SENTIMENT</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50/50">
                        <tr>
                            <th class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">PublishedAt</th>
                            <th class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Screen Name</th>
                            <th class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest w-1/3">Comment</th>
                            <th class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Likes</th>
                            <th class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right">Sentiment</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-12 text-center text-slate-400 italic">No files selected. Upload screenshots to begin.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentData = [];
        let summaryData = "";
        let sovData = {};
        let analysisTimestamp = null;
        let myChart = null;

        function handleFileSelect() {
            const files = document.getElementById('upload').files;
            const btn = document.getElementById('btn-run');
            const status = document.getElementById('file-status');
            if (files.length > 0) {
                btn.classList.remove('hidden');
                status.innerText = `${files.length} image(s) ready for analysis.`;
            }
        }

        function convertToISO(relative) {
            const date = new Date(analysisTimestamp);
            const r = (relative || "0s").toLowerCase();
            const val = parseInt(r.match(/\d+/) || 0);
            if (r.includes('s')) date.setSeconds(date.getSeconds() - val);
            else if (r.includes('m') && !r.includes('mo')) date.setMinutes(date.getMinutes() - val);
            else if (r.includes('h')) date.setHours(date.getHours() - val);
            else if (r.includes('d')) date.setDate(date.getDate() - val);
            else if (r.includes('w')) date.setDate(date.getDate() - (val * 7));
            else if (r.includes('mo')) date.setMonth(date.getMonth() - val);
            else if (r.includes('y')) date.setFullYear(date.getFullYear() - val);
            return date.toISOString();
        }

        async function startAnalysis() {
            const files = document.getElementById('upload').files;
            const btn = document.getElementById('btn-run');
            const tbody = document.getElementById('table-body');
            
            analysisTimestamp = new Date();
            btn.disabled = true;
            btn.innerText = "OCR Processing...";
            tbody.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-indigo-600 font-medium animate-pulse text-sm">Processing Images...</td></tr>`;

            try {
                let fullOCRText = "";
                for (let i = 0; i < files.length; i++) {
                    btn.innerText = `Reading Image ${i+1}/${files.length}...`;
                    const { data: { text } } = await Tesseract.recognize(files[i], 'eng');
                    fullOCRText += `\n[IMAGE ${i+1}]\n${text}`;
                }

                btn.innerText = "AI Classifying...";
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ payload: fullOCRText })
                });

                const result = await response.json();
                if (result.error) throw new Error(result.error);

                currentData = result.comments;
                summaryData = result.summary;
                sovData = result.sov;
                renderDashboard();

            } catch (err) {
                alert("Critical Error: " + err.message);
                tbody.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-red-500">Analysis Failed.</td></tr>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Analyze Now";
            }
        }

        function renderDashboard() {
            const tbody = document.getElementById('table-body');
            document.getElementById('top-row').classList.remove('hidden');
            document.getElementById('export-actions').classList.remove('hidden');
            document.getElementById('summary-text').innerText = summaryData;

            tbody.innerHTML = currentData.map(c => {
                const isImg = c.text.includes("[Image/GIF Only]");
                return `
                    <tr class="hover:bg-slate-50 transition-colors ${isImg ? 'opacity-50' : ''}">
                        <td class="p-4 font-mono text-[10px] text-slate-400">${convertToISO(c.timestamp)}</td>
                        <td class="p-4 font-bold text-slate-700 text-sm">${c.author}</td>
                        <td class="p-4 text-sm ${isImg ? 'italic text-slate-400' : 'text-slate-600'}">${c.text}</td>
                        <td class="p-4 font-black text-slate-800 text-xs text-center">${c.likes}</td>
                        <td class="p-4 text-right">
                            <span class="px-2 py-1 rounded text-[10px] font-bold uppercase ${getSentimentStyle(c.sentiment)}">
                                ${c.sentiment}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');

            updateChart();
        }

        function updateChart() {
            const ctx = document.getElementById('sovChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Positive', 'Negative', 'Neutral'],
                    datasets: [{
                        data: [sovData.Positive, sovData.Negative, sovData.Neutral],
                        backgroundColor: ['#10b981', '#f43f5e', '#94a3b8'],
                        borderWidth: 0
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    cutout: '70%'
                }
            });
        }

        function getSentimentStyle(s) {
            if (s === 'Positive') return 'bg-emerald-50 text-emerald-600';
            if (s === 'Negative') return 'bg-rose-50 text-rose-600';
            return 'bg-slate-100 text-slate-500';
        }

        function downloadCSV(includeSentiment) {
            const exportable = currentData.filter(c => !c.text.includes("[Image/GIF Only]"));
            
            // Field updates: UUID, PublishedAt, Screen Name
            let headers = "UUID,PublishedAt,Screen Name,Content,Likes";
            if (includeSentiment) headers += ",Sentiment";
            
            let csvRows = [headers];

            exportable.forEach(c => {
                const row = [
                    crypto.randomUUID(), // Add Random UUID
                    convertToISO(c.timestamp),
                    `"${c.author.replace(/"/g, '""')}"`,
                    `"${c.text.replace(/"/g, '""')}"`,
                    c.likes
                ];
                if (includeSentiment) row.push(c.sentiment);
                csvRows.push(row.join(","));
            });

            const blob = new Blob([csvRows.join("\n")], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `analytics_${includeSentiment ? 'full' : 'data'}.csv`;
            a.click();
        }
    </script>
</body>
</html>
