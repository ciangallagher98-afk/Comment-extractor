<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Analytics Pro | 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 text-slate-900 font-sans">
    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 tracking-tight text-center md:text-left">Social Analytics Pro</h1>
                <p id="file-status" class="text-slate-500 text-sm text-center md:text-left">Upload screenshots for deep analysis</p>
            </div>
            <div class="flex items-center gap-3">
                <input type="file" id="upload" accept="image/*" multiple class="hidden" onchange="handleFileSelect()">
                <button onclick="document.getElementById('upload').click()" class="bg-slate-100 text-slate-700 px-5 py-2.5 rounded-xl font-semibold hover:bg-slate-200 transition-all">Choose Images</button>
                <button onclick="startAnalysis()" id="btn-run" class="hidden bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all">Analyze Now</button>
            </div>
        </div>

        <div id="top-row" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 hidden">
            <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="text-[10px] uppercase tracking-widest text-slate-400 font-black mb-4 italic">Conversation Summary</h3>
                <p id="summary-text" class="text-slate-700 leading-relaxed text-sm">Analyzing themes...</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center">
                <h3 class="text-[10px] uppercase tracking-widest text-slate-400 font-black mb-4 italic text-center">Sentiment Share of Voice (SOV)</h3>
                <div class="w-full max-w-[150px] relative">
                    <canvas id="sovChart"></canvas>
                </div>
                <div id="stat-sov" class="mt-4 flex gap-4 text-[10px] font-bold"></div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
                <h3 class="font-bold text-slate-800">Extracted Comments</h3>
                <div id="export-actions" class="hidden flex items-center gap-3">
                    <button onclick="downloadCSV(false)" class="text-indigo-600 text-[10px] font-black hover:bg-indigo-50 px-3 py-2 rounded-lg border border-indigo-100 transition-all">📥 BASIC CSV</button>
                    <button onclick="downloadCSV(true)" class="bg-indigo-600 text-white text-[10px] font-black px-4 py-2 rounded-lg hover:bg-indigo-700 shadow-sm transition-all tracking-widest">📊 SENTIMENT REPORT</button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50/50">
                        <tr>
                            <th class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">PublishedAt</th>
                            <th class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Screen Name</th>
                            <th class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest w-1/3">Content</th>
                            <th class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Likes</th>
                            <th class="p-4 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right">Sentiment</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-12 text-center text-slate-300 italic text-sm">Upload images to begin processing.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const MAX_IMAGES = 8;          // keep in sync with api/process.js
        const MAX_WIDTH = 1080;        // screenshots stay legible; payload stays small
        const MAX_HEIGHT = 4096;
        const JPEG_QUALITY = 0.75;
        const MAX_PAYLOAD_BYTES = 4_000_000;

        let currentData = [];
        let summaryData = "";
        let sovData = {};
        let analysisTime = null;
        let myChart = null;

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        function handleFileSelect() {
            const files = document.getElementById('upload').files;
            const btn = document.getElementById('btn-run');
            const status = document.getElementById('file-status');
            if (files.length === 0) return;

            if (files.length > MAX_IMAGES) {
                btn.classList.add('hidden');
                status.innerText = `${files.length} files selected — maximum is ${MAX_IMAGES} per run.`;
                return;
            }
            btn.classList.remove('hidden');
            status.innerText = `${files.length} file(s) ready.`;
        }

        // Full-resolution screenshots blow past Vercel's ~4.5MB request body cap,
        // so shrink them in the browser before they ever hit the network.
        function downscale(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    const scale = Math.min(1, MAX_WIDTH / img.width, MAX_HEIGHT / img.height);
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(img.width * scale));
                    canvas.height = Math.max(1, Math.round(img.height * scale));
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY));
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error(`Could not read ${file.name}`));
                };
                img.src = url;
            });
        }

        function convertToISO(relative) {
            const now = analysisTime || new Date();
            const date = new Date(now);
            const r = String(relative ?? '').trim().toLowerCase();

            // Match the number and its unit together. "mo" is tested before the
            // single letters so "5mo" reads as months, not minutes.
            const match = r.match(/(\d+)\s*(mo|[smhdwy])/);
            if (!match) return date.toISOString();

            const val = parseInt(match[1], 10);
            switch (match[2]) {
                case 's': date.setSeconds(date.getSeconds() - val); break;
                case 'm': date.setMinutes(date.getMinutes() - val); break;
                case 'h': date.setHours(date.getHours() - val); break;
                case 'd': date.setDate(date.getDate() - val); break;
                case 'w': date.setDate(date.getDate() - val * 7); break;
                case 'mo': date.setMonth(date.getMonth() - val); break;
                case 'y': date.setFullYear(date.getFullYear() - val); break;
            }
            return date.toISOString();
        }

        async function startAnalysis() {
            const files = Array.from(document.getElementById('upload').files);
            const btn = document.getElementById('btn-run');
            const tbody = document.getElementById('table-body');

            analysisTime = new Date();
            btn.disabled = true;
            tbody.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-indigo-500 font-bold animate-pulse">PREPARING IMAGES...</td></tr>`;

            try {
                const images = [];
                for (let i = 0; i < files.length; i++) {
                    btn.innerText = `PREPARING ${i + 1}/${files.length}`;
                    images.push(await downscale(files[i]));
                }

                const bytes = images.reduce((sum, img) => sum + img.length, 0);
                if (bytes > MAX_PAYLOAD_BYTES) {
                    throw new Error('Screenshots are too large even after compression. Try fewer per run.');
                }

                btn.innerText = "READING SCREENSHOTS...";
                tbody.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-indigo-500 font-bold animate-pulse">READING SCREENSHOTS...</td></tr>`;

                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ images })
                });

                const result = await response.json().catch(() => ({ error: `Server returned ${response.status}` }));
                if (!response.ok || result.error) throw new Error(result.error || `Server returned ${response.status}`);

                currentData = Array.isArray(result.comments) ? result.comments : [];
                summaryData = result.summary || "";
                sovData = result.sov || {};

                if (currentData.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-slate-400 italic text-sm">No comments found in these screenshots.</td></tr>`;
                    return;
                }
                renderDashboard();

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-12 text-center text-red-500">Failed: ${esc(err.message)}</td></tr>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Analyze Now";
            }
        }

        function renderDashboard() {
            document.getElementById('top-row').classList.remove('hidden');
            document.getElementById('export-actions').classList.remove('hidden');
            document.getElementById('summary-text').innerText = summaryData;

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = currentData.map(c => {
                const isImg = c.text === "[Image/GIF Only]";
                return `
                    <tr class="hover:bg-slate-50 transition-colors ${isImg ? 'opacity-40' : ''}">
                        <td class="p-4 font-mono text-[9px] text-slate-400">${esc(convertToISO(c.timestamp))}</td>
                        <td class="p-4 font-bold text-slate-700 text-xs uppercase">${c.isReply ? '<span class="text-slate-300 mr-1">↳</span>' : ''}${esc(c.author)}</td>
                        <td class="p-4 text-xs ${isImg ? 'italic' : 'text-slate-600'}">${esc(c.text)}</td>
                        <td class="p-4 font-black text-slate-800 text-xs text-center">${esc(c.likes)}</td>
                        <td class="p-4 text-right">
                            <span class="px-2 py-1 rounded text-[9px] font-black uppercase ${getStyle(c.sentiment)}">
                                ${esc(c.sentiment || 'Neutral')}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');

            const pos = sovData.Positive || 0;
            const neg = sovData.Negative || 0;
            const neu = sovData.Neutral || 0;

            document.getElementById('stat-sov').innerHTML = `
                <span class="text-emerald-500">POS ${esc(pos)}%</span>
                <span class="text-rose-500">NEG ${esc(neg)}%</span>
                <span class="text-slate-400">NEU ${esc(neu)}%</span>
            `;

            updateChart(pos, neg, neu);
        }

        function updateChart(pos, neg, neu) {
            const ctx = document.getElementById('sovChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Pos', 'Neg', 'Neu'],
                    datasets: [{
                        data: [pos, neg, neu],
                        backgroundColor: ['#10b981', '#f43f5e', '#94a3b8'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: { plugins: { legend: { display: false } }, cutout: '75%' }
            });
        }

        function getStyle(s) {
            if (s === 'Positive') return 'bg-emerald-50 text-emerald-600';
            if (s === 'Negative') return 'bg-rose-50 text-rose-600';
            return 'bg-slate-50 text-slate-400 border border-slate-100';
        }

        // A leading =, +, - or @ makes Excel and Sheets treat the cell as a
        // formula, so prefix those with a quote before quoting the field.
        function csvCell(value) {
            let s = String(value ?? '');
            if (/^[=+\-@]/.test(s)) s = `'${s}`;
            return `"${s.replace(/"/g, '""')}"`;
        }

        function downloadCSV(withSent) {
            const cleanData = currentData.filter(c => c.text !== "[Image/GIF Only]");
            let head = "UUID,PublishedAt,Screen Name,Content,Likes";
            if (withSent) head += ",Sentiment";

            const rows = [head];
            cleanData.forEach(c => {
                const row = [
                    crypto.randomUUID(),
                    convertToISO(c.timestamp),
                    csvCell(c.author),
                    csvCell(c.text),
                    Number(c.likes) || 0
                ];
                if (withSent) row.push(c.sentiment);
                rows.push(row.join(","));
            });

            const blob = new Blob([rows.join("\n")], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `report_${withSent ? 'full' : 'basic'}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
