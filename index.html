<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Analytics Dashboard 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Comment Analytics</h1>
                <p class="text-slate-500 text-sm">Upload screenshots to extract and analyze</p>
            </div>
            <div class="flex items-center gap-3">
                <input type="file" id="upload" accept="image/*" multiple class="hidden" onchange="handleFileSelect()">
                <button onclick="document.getElementById('upload').click()" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-medium hover:bg-slate-300">
                    Choose Images
                </button>
                <button onclick="startAnalysis()" id="btn-run" class="hidden bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-indigo-700 disabled:opacity-50">
                    Analyze Now
                </button>
            </div>
        </div>

        <div id="file-list" class="mb-6 text-sm text-slate-500"></div>

        <div id="stats-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 hidden">
            <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-indigo-500">
                <p class="text-sm text-slate-500 font-medium">Total Comments</p>
                <h2 id="stat-count" class="text-3xl font-bold text-slate-800">0</h2>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-emerald-500">
                <p class="text-sm text-slate-500 font-medium">Sentiment SOV</p>
                <div id="stat-sov" class="text-xs font-bold mt-2 flex gap-1 items-center"></div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border-b-4 border-amber-500">
                <p class="text-sm text-slate-500 font-medium">Top Comment (Likes)</p>
                <p id="stat-top" class="text-sm text-slate-700 mt-1 italic line-clamp-2">N/A</p>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 class="font-bold text-slate-800">Extracted Data</h3>
                <button onclick="downloadCSV()" id="btn-csv" class="text-indigo-600 text-sm font-bold hidden">+ Export CSV</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="p-4 text-xs font-bold text-slate-500 uppercase">Author</th>
                            <th class="p-4 text-xs font-bold text-slate-500 uppercase w-1/2">Comment</th>
                            <th class="p-4 text-xs font-bold text-slate-500 uppercase">Likes</th>
                            <th class="p-4 text-xs font-bold text-slate-500 uppercase">Sentiment</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y">
                        <tr><td colspan="4" class="p-8 text-center text-slate-400 italic">Upload images to begin.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentData = [];

        function handleFileSelect() {
            const files = document.getElementById('upload').files;
            const btnRun = document.getElementById('btn-run');
            const fileList = document.getElementById('file-list');

            if (files.length > 0) {
                btnRun.classList.remove('hidden');
                fileList.innerText = `${files.length} file(s) selected: ` + Array.from(files).map(f => f.name).join(', ');
            } else {
                btnRun.classList.add('hidden');
                fileList.innerText = "";
            }
        }

        async function startAnalysis() {
            const files = document.getElementById('upload').files;
            const btn = document.getElementById('btn-run');
            const tableBody = document.getElementById('table-body');
            
            btn.disabled = true;
            btn.innerText = "Processing OCR...";
            tableBody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-indigo-600 animate-pulse font-medium">Reading images... this may take a moment.</td></tr>`;

            try {
                let combinedText = "";

                // 1. Loop through all images for OCR
                for (let i = 0; i < files.length; i++) {
                    btn.innerText = `OCR: Image ${i+1}/${files.length}`;
                    const { data: { text } } = await Tesseract.recognize(files[i], 'eng');
                    combinedText += `\n--- NEW IMAGE START ---\n${text}`;
                }
                
                // 2. AI Analysis Step
                btn.innerText = "AI Analyzing...";
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ payload: combinedText })
                });

                const result = await response.json();
                if (result.error) throw new Error(result.error);

                currentData = result.comments;
                renderDashboard(result);

            } catch (err) {
                alert("Error: " + err.message);
                tableBody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-red-500">Failed to analyze. Check console.</td></tr>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Analyze Now";
            }
        }

        function renderDashboard(data) {
            const tbody = document.getElementById('table-body');
            const sovDiv = document.getElementById('stat-sov');
            document.getElementById('stats-container').classList.remove('hidden');
            document.getElementById('btn-csv').classList.remove('hidden');
            
            tbody.innerHTML = data.comments.map(c => {
                const isImage = c.text.includes("[Image/GIF Only]");
                return `
                    <tr class="hover:bg-slate-50 ${isImage ? 'opacity-60' : ''}">
                        <td class="p-4 font-medium text-slate-700">${c.author}</td>
                        <td class="p-4 text-sm ${isImage ? 'italic text-slate-400' : 'text-slate-600'}">${c.text}</td>
                        <td class="p-4 text-slate-500 font-bold">${c.likes}</td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded-full text-[10px] font-bold uppercase ${getSentimentClass(c.sentiment)}">
                                ${c.sentiment}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');

            document.getElementById('stat-count').innerText = data.comments.length;
            
            const sorted = [...data.comments].sort((a, b) => b.likes - a.likes);
            if(sorted.length > 0) {
                document.getElementById('stat-top').innerText = `"${sorted[0].text}"`;
            }

            const sov = data.sov;
            sovDiv.innerHTML = `
                <span class="text-emerald-600 font-bold">POS ${sov.Positive}%</span>
                <span class="mx-1">|</span>
                <span class="text-rose-600 font-bold">NEG ${sov.Negative}%</span>
                <span class="mx-1">|</span>
                <span class="text-slate-500 font-bold">NEU ${sov.Neutral}%</span>
            `;
        }

        function getSentimentClass(s) {
            if (s === 'Positive') return 'bg-emerald-100 text-emerald-700';
            if (s === 'Negative') return 'bg-rose-100 text-rose-700';
            return 'bg-slate-100 text-slate-700';
        }

        function downloadCSV() {
            // Filter out Image/GIF only comments for the CSV
            const exportableData = currentData.filter(c => !c.text.includes("[Image/GIF Only]"));

            let csv = "Date,Author,Content,Likes,Sentiment\n";
            const today = new Date().toLocaleDateString();
            
            exportableData.forEach(c => {
                csv += `${today},"${c.author.replace(/"/g, '""')}","${c.text.replace(/"/g, '""')}",${c.likes},${c.sentiment}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `social_analytics_${Date.now()}.csv`);
            a.click();
        }
    </script>
</body>
</html>
